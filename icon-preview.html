<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Icon Preview</title>
<style>
  body { background: #1a1a2e; color: #e0e0e0; font-family: Arial, sans-serif; padding: 40px; }
  h1 { text-align: center; margin-bottom: 40px; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; max-width: 900px; margin: 0 auto; }
  .card { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 20px; text-align: center; }
  .card svg { margin-bottom: 12px; }
  .card .name { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .card .color-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<h1>BRM5 Map - Icon Preview</h1>
<div class="grid">

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#44cc88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="3" x2="5" y2="22"/>
    <path d="M5 3h12l-3 4.5L17 12H5" fill="#44cc88" fill-opacity="0.25"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#44cc88"></span>Player Spawn</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6699cc" stroke-width="2">
    <path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/>
    <rect x="9" y="9" width="2" height="2" fill="#6699cc"/><rect x="13" y="9" width="2" height="2" fill="#6699cc"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#6699cc"></span>Explorable Area</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff6b9d" stroke-width="2">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
    <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#ff6b9d"></span>Exfil Point</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#cc4444" stroke-width="2">
    <path d="M12 2L2 20h20L12 2z"/>
    <line x1="12" y1="9" x2="12" y2="14" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="1" fill="#cc4444" stroke="none"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#cc4444"></span>Enemy Location</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#cc4444" stroke-width="2">
    <path d="M8 2C4.5 2 2 5 2 8.5c0 2 .8 3.5 2 4.5H8"/>
    <path d="M16 2c3.5 0 6 3 6 6.5 0 2-.8 3.5-2 4.5H16"/>
    <rect x="5" y="4" width="14" height="12" rx="5"/>
    <circle cx="9" cy="10" r="1.5" fill="#cc4444" stroke="none"/>
    <circle cx="15" cy="10" r="1.5" fill="#cc4444" stroke="none"/>
    <path d="M9 16v2M12 16v3M15 16v2" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="16" y2="22"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#cc4444"></span>Zombie Nest</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4a544" stroke-width="2">
    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#d4a544"></span>Key Spawn Location</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4a544" stroke-width="2">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#d4a544"></span>Locked Door</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#cc8844" stroke-width="2">
    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
    <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#cc8844"></span>Quarantine Zone</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#44aacc" stroke-width="2">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#44aacc"></span>Medical</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#aa88cc" stroke-width="2">
    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#aa88cc"></span>Shop</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#cccc44" stroke-width="2">
    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
    <circle cx="12" cy="10" r="3"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#cccc44"></span>Landmark</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9966cc" stroke-width="2">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <path d="M7 16V8l5 5 5-5v8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#9966cc"></span>Subway Station</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5599dd" stroke-width="2">
    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
    <circle cx="12" cy="12" r="3"/>
    <circle cx="12" cy="12" r="1" fill="#5599dd" stroke="none"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#5599dd"></span>Drop-Off Point</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#dd5555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s-8-4.5-8-11V5l8-3 8 3v6c0 6.5-8 11-8 11z"/>
    <line x1="12" y1="7" x2="12" y2="12"/>
    <circle cx="12" cy="15" r="1" fill="#dd5555" stroke="none"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#dd5555"></span>Raid</div>
</div>

<div class="card">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2">
    <circle cx="12" cy="12" r="4"/>
  </svg>
  <div class="name"><span class="color-dot" style="background:#888888"></span>Other</div>
</div>

</div>
</body>
</html>
